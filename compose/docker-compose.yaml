version: '3.8'

services:
  db-1:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_creation
    ports: ["5432:5432"]
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_creation"]
      interval: 5s
      retries: 15

  db-2:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_confirmation
    ports: ["5433:5432"]
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_confirmation"]
      interval: 5s
      retries: 15

  db-3:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_processing
    ports: ["5434:5432"]
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_processing"]
      interval: 5s
      retries: 15

  kafka:
    image: bitnamilegacy/kafka:latest
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_KRAFT_CLUSTER_ID: saga-cluster
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    networks: [app-network]

  kafka-ui:
    image: provectuslabs/kafka-ui
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks: [app-network]

  debezium:
    image: debezium/connect:3.0.0.Final
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: saga
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_started
    networks: [app-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  debezium-init:
    image: curlimages/curl:latest
    depends_on:
      debezium:
        condition: service_healthy
    entrypoint: >
      sh -c "
      echo 'Waiting for Debezium to be ready...' &&
      sleep 20 &&
  
      echo 'Creating order-creation connector...' &&
      curl -X POST http://debezium:8083/connectors \
      -H 'Content-Type: application/json' \
      -d '{
        \"name\": \"order-creation-connector\",
        \"config\": {
          \"connector.class\": \"io.debezium.connector.postgresql.PostgresConnector\",
          \"database.hostname\": \"db-1\",
          \"database.port\": \"5432\",
          \"database.user\": \"postgres\",
          \"database.password\": \"postgres\",
          \"database.dbname\": \"order_creation\",
          \"topic.prefix\": \"ignored\",
          \"plugin.name\": \"pgoutput\",
          \"slot.name\": \"order_creation_slot\",
          \"publication.name\": \"order_creation_pub\",
          \"table.include.list\": \"public.outbox_event\",
  
          \"key.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
          \"key.converter.schemas.enable\": \"false\",
          \"value.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
          \"value.converter.schemas.enable\": \"false\",
  
          \"transforms\": \"outbox\",
          \"transforms.outbox.type\": \"io.debezium.transforms.outbox.EventRouter\",
          \"transforms.outbox.route.by.field\": \"event_type\",
          \"transforms.outbox.route.topic.replacement\": \"$${routedByValue}\",
          \"transforms.outbox.table.field.event.key\": \"aggregate_id\",
          \"transforms.outbox.table.field.event.payload\": \"payload\",
          \"transforms.outbox.table.field.event.payload.parse.as.json\": \"true\",
          \"tombstones.on.delete\": \"false\"
        }
      }' &&
  
      sleep 5 &&
  
      echo 'Creating order-confirmation connector...' &&
      curl -X POST http://debezium:8083/connectors \
      -H 'Content-Type: application/json' \
      -d '{
        \"name\": \"order-confirmation-connector\",
        \"config\": {
          \"connector.class\": \"io.debezium.connector.postgresql.PostgresConnector\",
          \"database.hostname\": \"db-2\",
          \"database.port\": \"5432\",
          \"database.user\": \"postgres\",
          \"database.password\": \"postgres\",
          \"database.dbname\": \"order_confirmation\",
          \"topic.prefix\": \"ignored\",
          \"plugin.name\": \"pgoutput\",
          \"slot.name\": \"order_confirmation_slot\",
          \"publication.name\": \"order_confirmation_pub\",
          \"table.include.list\": \"public.outbox_event\",
  
          \"key.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
          \"key.converter.schemas.enable\": \"false\",
          \"value.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
          \"value.converter.schemas.enable\": \"false\",
  
          \"transforms\": \"outbox\",
          \"transforms.outbox.type\": \"io.debezium.transforms.outbox.EventRouter\",
          \"transforms.outbox.route.by.field\": \"event_type\",
          \"transforms.outbox.route.topic.replacement\": \"$${routedByValue}\",
          \"transforms.outbox.table.field.event.key\": \"aggregate_id\",
          \"transforms.outbox.table.field.event.payload\": \"payload\",
                \"transforms.outbox.table.field.event.payload.parse.as.json\": \"true\",
          \"tombstones.on.delete\": \"false\"
        }
      }' &&
  
      sleep 5 &&
  
      echo 'Creating order-processing connector...' &&
      curl -X POST http://debezium:8083/connectors \
      -H 'Content-Type: application/json' \
      -d '{
        \"name\": \"order-processing-connector\",
        \"config\": {
          \"connector.class\": \"io.debezium.connector.postgresql.PostgresConnector\",
          \"database.hostname\": \"db-3\",
          \"database.port\": \"5432\",
          \"database.user\": \"postgres\",
          \"database.password\": \"postgres\",
          \"database.dbname\": \"order_processing\",
          \"topic.prefix\": \"ignored\",
          \"plugin.name\": \"pgoutput\",
          \"slot.name\": \"order_processing_slot\",
          \"publication.name\": \"order_processing_pub\",
          \"table.include.list\": \"public.outbox_event\",
  
          \"key.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
          \"key.converter.schemas.enable\": \"false\",
          \"value.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
          \"value.converter.schemas.enable\": \"false\",
  
          \"transforms\": \"outbox\",
          \"transforms.outbox.type\": \"io.debezium.transforms.outbox.EventRouter\",
          \"transforms.outbox.route.by.field\": \"event_type\",
          \"transforms.outbox.route.topic.replacement\": \"$${routedByValue}\",
          \"transforms.outbox.table.field.event.key\": \"aggregate_id\",
          \"transforms.outbox.table.field.event.payload\": \"payload\",
          \"transforms.outbox.table.field.event.payload.parse.as.json\": \"true\",
          \"tombstones.on.delete\": \"false\"
        }
      }' &&
  
      echo 'Connectors created:' &&
      curl http://debezium:8083/connectors
      "
    networks: [app-network]

  migration-service:
    build:
      context: ..
      dockerfile: migration_service/Dockerfile
    image: migration-service:latest
    container_name: migration-service
    depends_on:
      db-1:
        condition: service_healthy
      db-2:
        condition: service_healthy
      db-3:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_PRIMARY_URL: jdbc:postgresql://db-1:5432/order_creation
      SPRING_DATASOURCE_PRIMARY_USERNAME: postgres
      SPRING_DATASOURCE_PRIMARY_PASSWORD: postgres

      SPRING_DATASOURCE_SECOND_URL: jdbc:postgresql://db-2:5432/order_confirmation
      SPRING_DATASOURCE_SECOND_USERNAME: postgres
      SPRING_DATASOURCE_SECOND_PASSWORD: postgres

      SPRING_DATASOURCE_THIRD_URL: jdbc:postgresql://db-3:5432/order_processing
      SPRING_DATASOURCE_THIRD_USERNAME: postgres
      SPRING_DATASOURCE_THIRD_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8099
    networks:
      - app-network

  order-creation-service:
    image: order-creation-service:latest
    build:
      context: ..
      dockerfile: order-creation-service/Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      db-1:
        condition: service_healthy
      kafka:
        condition: service_started
      migration-service:
        condition: service_completed_successfully
    environment:
      SPRING_APPLICATION_NAME: order-creation-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-1:5432/order_creation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: order-creation-group
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_MAX_POOL_RECORDS: 30
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SERVER_PORT: "8084"
      LOGGING_LEVEL_BY_RAIKIRI: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL: TRACE
    networks:
      - app-network

  order-confirmation-service:
    image: order-confirmation-service:latest
    build:
      context: ..
      dockerfile: order-confirmation-service/Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      db-2:
        condition: service_healthy
      kafka:
        condition: service_started
      migration-service:
        condition: service_completed_successfully
    environment:
      SPRING_APPLICATION_NAME: order-confirmation-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-2:5432/order_confirmation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: order-confirmation-group
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SERVER_PORT: "8085"
      LOGGING_LEVEL_BY_RAIKIRI: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL: TRACE
    networks:
      - app-network

  order-processing-service:
    image: order-processing-service:latest
    build:
      context: ..
      dockerfile: order-processing-service/Dockerfile
    ports:
      - "8086:8086"
    depends_on:
      db-3:
        condition: service_healthy
      kafka:
        condition: service_started
      migration-service:
        condition: service_completed_successfully
    environment:
      SPRING_APPLICATION_NAME: order-processing-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-3:5432/order_processing
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: order-processing-group
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SERVER_PORT: "8086"
      LOGGING_LEVEL_BY_RAIKIRI: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL: TRACE
    networks:
      - app-network

networks:
  app-network: